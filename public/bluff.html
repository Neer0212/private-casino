<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Bluff (Cheat)</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .table {
            background: radial-gradient(ellipse, #8e44ad 0%, #2c3e50 100%);
            border-color: #111;
        }

        .card { cursor: pointer; }
        .card.selected {
            border: 3px solid var(--neon-red);
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(255, 118, 117, 0.5);
        }

        .card-back {
            background: repeating-linear-gradient(45deg, #2980b9, #2980b9 10px, #fff 10px, #fff 20px);
            color: transparent;
            cursor: default;
        }

        .center-pile {
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed var(--neon-gold);
            border-radius: 15px;
            padding: 20px;
            margin: 20px auto;
            width: 250px;
            text-align: center;
        }

        .timer-bar {
            height: 10px;
            background: var(--neon-red);
            width: 0%;
            border-radius: 5px;
            transition: width 1s linear;
            margin-top: 10px;
        }
        
        select {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <h1 class="text-purple">Bluff (Cheat)</h1>

    <div class="nav-links">
        <a href="/" class="nav-leaderboard">🏠 Casino Lobby</a>
        <a href="/blackjack.html" class="nav-blackjack">♠️ Blackjack</a>
        <a href="/poker.html" class="nav-poker">🃏 Poker</a>
    </div>

    <div class="main-layout">
        
        <div class="game-area">
            <div class="table" id="gameTable">
                <div class="glass-panel" style="margin-bottom: 20px; width: 90%; max-width: 450px;">
                    <input type="text" id="usernameInput" placeholder="Enter Username">
                    <input type="text" id="roomInput" placeholder="Room ID">
                    <button onclick="joinBluff()" class="btn-primary">Join Game</button>
                    <h4 id="status" class="text-muted" style="margin-top: 15px; margin-bottom: 0;">Standing at the edge of the room...</h4>
                </div>

                <div id="bluffBoard" style="display: none; margin-top: 20px; width: 100%;">
                    <button onclick="devStartGame()" class="btn-info" style="margin-bottom: 15px;">🛠️ Deal Cards (Start Game)</button>

                    <h3 id="turnIndicator" class="text-red" style="font-size: 22px;">Waiting to start...</h3>

                    <div class="center-pile">
                        <h3 class="text-gold" style="margin: 0;">Center Pile</h3>
                        <div id="pileCount" style="font-size: 36px; font-weight: bold; color: white;">0</div>
                        <p class="text-muted" style="font-size: 12px;">cards</p>
                        <p id="latestClaim" class="text-green" style="font-weight: bold; font-size: 16px; min-height: 20px;"></p>
                        <div id="timerBar" class="timer-bar"></div>
                        <button id="btnCallBluff" class="btn-danger" onclick="sendAction('call_bluff')" style="width: 100%; margin-top: 10px; display: none;">🚨 CALL BLUFF!</button>

                        <div id="cardPickerArea" style="display: none; margin-top: 15px; border-top: 1px solid #555; padding-top: 10px;">
                            <p id="cardPickerText" class="text-gold" style="font-weight: bold; margin: 0 0 10px 0;">Pick a card to flip!</p>
                            <div id="cardPickerCards" class="card-container" style="min-height: auto; margin: 0;"></div>
                        </div>
                    </div>

                    <hr>

                    <h3 class="text-muted">Your Hand (<span id="myCardCount">0</span>)</h3>
                    <div id="myCards" class="card-container"></div>

                    <div id="bluffActions" class="glass-panel" style="margin-top: 20px; display: inline-block;">
                        <p class="text-muted" style="font-size: 14px; margin-top: 0;">Select cards, then declare their rank:</p>
                        <select id="rankSelector">
                            <option value="2">2s</option>
                            <option value="3">3s</option>
                            <option value="4">4s</option>
                            <option value="5">5s</option>
                            <option value="6">6s</option>
                            <option value="7">7s</option>
                            <option value="8">8s</option>
                            <option value="9">9s</option>
                            <option value="10">10s</option>
                            <option value="J">Jacks</option>
                            <option value="Q">Queens</option>
                            <option value="K">Kings</option>
                            <option value="A">Aces</option>
                        </select>
                        <button id="btnPlayCards" onclick="playSelectedCards()" class="btn-success" disabled>Play Selected Cards</button>
                    </div>
                </div>

                <hr>
                <h3 class="text-muted">Opponents</h3>
                <div id="otherPlayers" style="display: flex; justify-content: space-around; flex-wrap: wrap; gap: 10px; width: 100%;"></div>
            </div>
        </div>

        
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentTable = "";
        let selectedCardsIndices = [];

        function createCardHTML(cardData, index, isHidden = false) {
            if (isHidden) return `<div class="card card-back"></div>`;
            let symbol = "", colorClass = "";
            if (cardData.suit === 'Hearts') { symbol = "♥"; colorClass = "red"; }
            if (cardData.suit === 'Diamonds') { symbol = "♦"; colorClass = "red"; }
            if (cardData.suit === 'Clubs') { symbol = "♣"; colorClass = "black"; }
            if (cardData.suit === 'Spades') { symbol = "♠"; colorClass = "black"; }

            let isSelected = selectedCardsIndices.includes(index) ? "selected" : "";
            return `<div class="card ${colorClass} ${isSelected}" data-value="${cardData.value}" onclick="toggleCardSelection(${index})">
                        <div>${cardData.value}</div>
                        <div style="font-size: 24px;">${symbol}</div>
                    </div>`;
        }

        function toggleCardSelection(index) {
            const pos = selectedCardsIndices.indexOf(index);
            if (pos > -1) {
                selectedCardsIndices.splice(pos, 1);
            } else {
                selectedCardsIndices.push(index);
            }
            renderMyHand(window.myCurrentHand || []);
            document.getElementById('btnPlayCards').disabled = selectedCardsIndices.length === 0;
        }

        function renderMyHand(cards) {
            window.myCurrentHand = cards;
            let html = "";
            cards.forEach((c, i) => html += createCardHTML(c, i));
            document.getElementById('myCards').innerHTML = html;
            document.getElementById('myCardCount').innerText = cards.length;
        }

        function joinBluff() {
            const username = document.getElementById('usernameInput').value;
            const rawRoom = document.getElementById('roomInput').value;
            if (!username) return alert("Enter a username!");
            currentTable = (rawRoom && rawRoom.trim() !== "") ? rawRoom.trim() : "Bluff-1";
            socket.emit('joinBluff', { tableId: currentTable, username });

            document.getElementById('status').innerText = `Sitting at ${currentTable}`;
                        document.getElementById('bluffBoard').style.display = "block";
        }

        function devStartGame() { socket.emit('devStartBluff', currentTable); }

        function playSelectedCards() {
            const claimedRank = document.getElementById('rankSelector').value;
            socket.emit('playBluffCards', {
                tableId: currentTable,
                cardIndices: selectedCardsIndices,
                claimedRank
            });
            selectedCardsIndices = [];
            document.getElementById('btnPlayCards').disabled = true;
        }

        function sendAction(action) {
            socket.emit('bluffAction', { tableId: currentTable, action });
        }

        function resolveBluff(index) {
            socket.emit('resolveBluffCard', { tableId: currentTable, cardIndex: index });
        }

        socket.on('receiveBluffHand', (cards) => {
            selectedCardsIndices = [];
            renderMyHand(cards);
        });

        socket.on('bluffStateUpdate', (data) => {
            const myUsername = document.getElementById('usernameInput').value;

            document.getElementById('pileCount').innerText = data.pileCount;
            document.getElementById('latestClaim').innerText = data.latestClaim;

            let otherPlayersHTML = "";
            let isMyTurn = false;

            data.players.forEach(p => {
                if (p.username === myUsername) {
                    isMyTurn = p.isTurn;
                } else {
                    let borderStyle = p.isTurn ? 'border: 3px solid var(--neon-green); box-shadow: 0 0 15px var(--neon-green);' : 'border: 1px solid var(--neon-blue);';
                    otherPlayersHTML += `
                    <div class="glass-panel" style="padding: 15px; width: 120px; ${borderStyle}">
                        <h4 class="text-blue" style="margin: 0 0 5px 0;">👤 ${p.username}</h4>
                        <p class="text-gold" style="margin: 0; font-size: 24px; font-weight: bold;">${p.cardCount} <span class="text-muted" style="font-size: 14px;">cards</span></p>
                    </div>`;
                }
            });
            document.getElementById('otherPlayers').innerHTML = otherPlayersHTML;

            const turnInd = document.getElementById('turnIndicator');
            const btnCallBluff = document.getElementById('btnCallBluff');
            const playArea = document.getElementById('bluffActions');
            const timerBar = document.getElementById('timerBar');
            const cardPickerArea = document.getElementById('cardPickerArea');
            const cardPickerCards = document.getElementById('cardPickerCards');

            cardPickerArea.style.display = 'none';

            if (data.stage === 'waiting') {
                turnInd.innerText = "Waiting to start...";
                turnInd.className = "text-muted";
                btnCallBluff.style.display = 'none';
                playArea.style.opacity = '0.5';
                playArea.style.pointerEvents = 'none';
            }
            else if (data.stage === 'interrogation') {
                turnInd.innerText = "🚨 INTERROGATION PHASE 🚨";
                turnInd.className = "text-red";
                playArea.style.opacity = '0.5';
                playArea.style.pointerEvents = 'none';

                if (data.lastPlayer !== myUsername) {
                    btnCallBluff.style.display = 'block';
                }
            }
            else if (data.stage === 'bluff_called') {
                btnCallBluff.style.display = 'none';
                timerBar.style.width = '0%';
                playArea.style.opacity = '0.5';
                playArea.style.pointerEvents = 'none';
                cardPickerArea.style.display = 'block';

                if (data.accuser === myUsername) {
                    turnInd.innerText = "🔍 PICK A CARD TO REVEAL!";
                    turnInd.className = "text-gold";
                    document.getElementById('cardPickerText').innerText = "Click one of their cards to flip it:";

                    let cardsHtml = "";
                    for (let i = 0; i < data.lastPlayedCount; i++) {
                        cardsHtml += `<div class="card card-back" style="cursor: pointer; border-color: var(--neon-gold);" onclick="resolveBluff(${i})"></div>`;
                    }
                    cardPickerCards.innerHTML = cardsHtml;
                } else {
                    turnInd.innerText = `🔍 ${data.accuser} is picking a card...`;
                    turnInd.className = "text-gold";
                    document.getElementById('cardPickerText').innerText = "Waiting for them to pick...";
                    cardPickerCards.innerHTML = ""; 
                }
            }
            else if (data.stage === 'bluff_revealed') {
                btnCallBluff.style.display = 'none';
                timerBar.style.width = '0%';
                playArea.style.opacity = '0.5';
                playArea.style.pointerEvents = 'none';
                cardPickerArea.style.display = 'block';
                turnInd.innerText = data.isLie ? "🚨 LIE DETECTED!" : "✅ IT WAS THE TRUTH!";
                turnInd.className = data.isLie ? "text-red" : "text-green";
                
                document.getElementById('cardPickerText').innerText = data.bluffResultText;
                
                if (data.revealedCard) {
                    let symbol = "", colorClass = "";
                    if (data.revealedCard.suit === 'Hearts') { symbol = "♥"; colorClass = "red"; }
                    if (data.revealedCard.suit === 'Diamonds') { symbol = "♦"; colorClass = "red"; }
                    if (data.revealedCard.suit === 'Clubs') { symbol = "♣"; colorClass = "black"; }
                    if (data.revealedCard.suit === 'Spades') { symbol = "♠"; colorClass = "black"; }
                    cardPickerCards.innerHTML = `<div class="card ${colorClass}" data-value="${data.revealedCard.value}" style="cursor: default; border-color: ${data.isLie ? 'var(--neon-red)' : 'var(--neon-green)'}; transform: scale(1.2);">
                                                    <div>${data.revealedCard.value}</div>
                                                    <div style="font-size: 24px;">${symbol}</div>
                                                </div>`;
                }
            }
            else if (data.stage === 'playing') {
                timerBar.style.width = '0%';
                btnCallBluff.style.display = 'none';

                if (isMyTurn) {
                    turnInd.innerText = "🟩 YOUR TURN!";
                    turnInd.className = "text-green";
                    playArea.style.opacity = '1';
                    playArea.style.pointerEvents = 'auto';
                } else {
                    turnInd.innerText = "🟥 Waiting for others...";
                    turnInd.className = "text-red";
                    playArea.style.opacity = '0.5';
                    playArea.style.pointerEvents = 'none';
                }
            }
        });

        socket.on('startInterrogationTimer', (data) => {
            const timerBar = document.getElementById('timerBar');
            timerBar.style.transition = 'none';
            timerBar.style.width = '100%';

            setTimeout(() => {
                timerBar.style.transition = `width ${data.seconds}s linear`;
                timerBar.style.width = '0%';
            }, 50);
        });

        
    </script>
</body>
</html>
