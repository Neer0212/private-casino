<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Bluff (Cheat)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #111;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }

        .table {
            background: radial-gradient(ellipse, #8e44ad 0%, #2c3e50 100%);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 1000px;
            margin: auto;
            border: 10px solid #111;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.7), 0 10px 30px rgba(0, 0, 0, 0.8);
            position: relative;
            min-height: 600px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            border-radius: 5px;
            border: none;
            background-color: #f1c40f;
            color: #111;
            transition: 0.2s;
        }

        button:hover {
            background-color: #f39c12;
            transform: scale(1.05);
        }

        button:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }

        input,
        select {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin: 15px 0;
            min-height: 120px;
            flex-wrap: wrap;
        }

        .card {
            width: 60px;
            height: 90px;
            background-color: white;
            border-radius: 8px;
            border: 2px solid #ccc;
            box-shadow: 2px 4px 8px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            position: relative;
            background-image: linear-gradient(135deg, #fff 0%, #f9f9f9 100%);
            cursor: pointer;
            transition: 0.2s;
        }

        .card.selected {
            border: 3px solid #e74c3c;
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(231, 76, 60, 0.5);
        }

        .card-back {
            background: repeating-linear-gradient(45deg, #2980b9, #2980b9 10px, #fff 10px, #fff 20px);
            color: transparent;
            cursor: default;
        }

        .red {
            color: #d63031;
        }

        .black {
            color: #2d3436;
        }

        .card::before {
            content: attr(data-value);
            position: absolute;
            top: 3px;
            left: 5px;
            font-size: 12px;
        }

        .center-pile {
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed #f1c40f;
            border-radius: 15px;
            padding: 20px;
            margin: 20px auto;
            width: 250px;
            text-align: center;
        }

        .chat-widget {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #9b59b6;
            border-radius: 10px;
            padding: 15px;
            text-align: left;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            z-index: 100;
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 320px;
        }

        .timer-bar {
            height: 10px;
            background: #e74c3c;
            width: 0%;
            border-radius: 5px;
            transition: width 1s linear;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .chat-widget {
                position: relative;
                bottom: auto;
                right: auto;
                width: 100%;
                margin: 20px 0 0 0;
                box-sizing: border-box;
            }
        }
    </style>
</head>

<body>

    <h1 style="color: #9b59b6; letter-spacing: 2px;">Bluff (Cheat)</h1>

    <div style="margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
        <a href="/"
            style="color: #55efc4; text-decoration: none; font-weight: bold; border: 1px solid #55efc4; padding: 5px 15px; border-radius: 20px; font-size: 14px;">♠️
            Blackjack</a>
        <a href="/poker.html"
            style="color: #3498db; text-decoration: none; font-weight: bold; border: 1px solid #3498db; padding: 5px 15px; border-radius: 20px; font-size: 14px;">🃏
            Poker</a>
    </div>

    <div class="table" id="gameTable">
        <div style="background: rgba(0,0,0,0.5); padding: 15px; border-radius: 20px; display: inline-block;">
            <input type="text" id="usernameInput" placeholder="Enter Username">
            <input type="text" id="roomInput" placeholder="Room ID">
            <button onclick="joinBluff()">Join Game</button>
            <h2 id="status" style="font-size: 14px; color: #ccc; margin-top: 10px; margin-bottom: 0;">Standing at the
                edge of the room...</h2>
        </div>

        <div id="bluffBoard" style="display: none; margin-top: 20px;">
            <button onclick="devStartGame()" style="background-color: #ffcc00; margin-bottom: 15px;">🛠️ Deal Cards
                (Start Game)</button>

            <h3 id="turnIndicator" style="color: #e74c3c; font-size: 22px;">Waiting to start...</h3>

            <div class="center-pile">
                <h3 style="color: #f1c40f; margin: 0;">Center Pile</h3>
                <div id="pileCount" style="font-size: 36px; font-weight: bold; color: white;">0</div>
                <p style="color: #ccc; font-size: 12px;">cards</p>
                <p id="latestClaim" style="color: #55efc4; font-weight: bold; font-size: 16px; min-height: 20px;"></p>
                <div id="timerBar" class="timer-bar"></div>
                <button id="btnCallBluff" onclick="sendAction('call_bluff')"
                    style="background: #e74c3c; color: white; width: 100%; margin-top: 10px; display: none;">🚨 CALL
                    BLUFF!</button>

                <!-- NEW UI: THE CARD PICKER -->
                <div id="cardPickerArea"
                    style="display: none; margin-top: 15px; border-top: 1px solid #555; padding-top: 10px;">
                    <p id="cardPickerText" style="color: #f1c40f; font-weight: bold; margin: 0 0 10px 0;">Pick a card to
                        flip!</p>
                    <div id="cardPickerCards" class="card-container" style="min-height: auto; margin: 0;"></div>
                </div>
            </div>

            <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">

            <h3 style="color: #ccc;">Your Hand (<span id="myCardCount">0</span>)</h3>
            <div id="myCards" class="card-container"></div>

            <div id="bluffActions"
                style="margin-top: 20px; background: rgba(0,0,0,0.6); border-radius: 10px; padding: 15px; display: inline-block;">
                <p style="color: #ccc; font-size: 14px; margin-top: 0;">Select up to 4 cards, then declare their rank:
                </p>
                <select id="rankSelector">
                    <option value="2">2s</option>
                    <option value="3">3s</option>
                    <option value="4">4s</option>
                    <option value="5">5s</option>
                    <option value="6">6s</option>
                    <option value="7">7s</option>
                    <option value="8">8s</option>
                    <option value="9">9s</option>
                    <option value="10">10s</option>
                    <option value="J">Jacks</option>
                    <option value="Q">Queens</option>
                    <option value="K">Kings</option>
                    <option value="A">Aces</option>
                </select>
                <button id="btnPlayCards" onclick="playSelectedCards()" style="background: #3498db; color: white;"
                    disabled>Play Selected Cards</button>
            </div>
        </div>

        <hr style="border-color: rgba(255,255,255,0.1); margin: 30px 0;">
        <h3 style="color: #ccc;">Opponents</h3>
        <div id="otherPlayers" style="display: flex; justify-content: space-around; flex-wrap: wrap; gap: 10px;"></div>
    </div>

    <!-- Live Chat -->
    <div id="chatWidget" class="chat-widget">
        <h4
            style="color: #9b59b6; margin-top: 0; margin-bottom: 10px; border-bottom: 1px solid #9b59b6; padding-bottom: 5px;">
            🟣 <span id="chatRoomName">Bluff</span> Chat</h4>
        <div id="chatHistory"
            style="height: 150px; overflow-y: auto; color: white; font-size: 14px; font-family: monospace; display: flex; flex-direction: column; gap: 5px;">
        </div>
        <div style="display: flex; gap: 5px; margin-top: 10px;">
            <input type="text" id="chatInput" placeholder="Accuse them here..."
                style="width: 70%; padding: 8px; background: #222; color: white; box-sizing: border-box;">
            <button onclick="sendChat()"
                style="width: 30%; background-color: #9b59b6; color: white; box-sizing: border-box;">Send</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentTable = "";
        let selectedCardsIndices = [];

        function createCardHTML(cardData, index, isHidden = false) {
            if (isHidden) return `<div class="card card-back"></div>`;
            let symbol = "", colorClass = "";
            if (cardData.suit === 'Hearts') { symbol = "♥"; colorClass = "red"; }
            if (cardData.suit === 'Diamonds') { symbol = "♦"; colorClass = "red"; }
            if (cardData.suit === 'Clubs') { symbol = "♣"; colorClass = "black"; }
            if (cardData.suit === 'Spades') { symbol = "♠"; colorClass = "black"; }

            let isSelected = selectedCardsIndices.includes(index) ? "selected" : "";
            return `<div class="card ${colorClass} ${isSelected}" data-value="${cardData.value}" onclick="toggleCardSelection(${index})">
                        <div>${cardData.value}</div>
                        <div style="font-size: 24px;">${symbol}</div>
                    </div>`;
        }

        function toggleCardSelection(index) {
            const pos = selectedCardsIndices.indexOf(index);
            if (pos > -1) {
                selectedCardsIndices.splice(pos, 1);
            } else {
                if (selectedCardsIndices.length < 4) selectedCardsIndices.push(index);
                else alert("You can only play up to 4 cards at once.");
            }
            renderMyHand(window.myCurrentHand || []);
            document.getElementById('btnPlayCards').disabled = selectedCardsIndices.length === 0;
        }

        function renderMyHand(cards) {
            window.myCurrentHand = cards;
            let html = "";
            cards.forEach((c, i) => html += createCardHTML(c, i));
            document.getElementById('myCards').innerHTML = html;
            document.getElementById('myCardCount').innerText = cards.length;
        }

        function joinBluff() {
            const username = document.getElementById('usernameInput').value;
            const rawRoom = document.getElementById('roomInput').value;
            if (!username) return alert("Enter a username!");
            currentTable = (rawRoom && rawRoom.trim() !== "") ? rawRoom.trim() : "Bluff-1";
            socket.emit('joinBluff', { tableId: currentTable, username });

            document.getElementById('status').innerText = `Sitting at ${currentTable}`;
            document.getElementById('chatRoomName').innerText = currentTable;
            document.getElementById('bluffBoard').style.display = "block";
        }

        function devStartGame() { socket.emit('devStartBluff', currentTable); }

        function playSelectedCards() {
            const claimedRank = document.getElementById('rankSelector').value;
            socket.emit('playBluffCards', {
                tableId: currentTable,
                cardIndices: selectedCardsIndices,
                claimedRank
            });
            selectedCardsIndices = [];
            document.getElementById('btnPlayCards').disabled = true;
        }

        function sendAction(action) {
            socket.emit('bluffAction', { tableId: currentTable, action });
            function resolveBluff(index) {
                socket.emit('resolveBluffCard', { tableId: currentTable, cardIndex: index });
            }
        }

        // MOCK LISTENER FOR UI TESTING (Will be replaced in Phase 2)
        socket.on('receiveBluffHand', (cards) => {
            selectedCardsIndices = [];
            renderMyHand(cards);


            socket.on('bluffStateUpdate', (data) => {
                const myUsername = document.getElementById('usernameInput').value;

                document.getElementById('pileCount').innerText = data.pileCount;
                document.getElementById('latestClaim').innerText = data.latestClaim;

                let otherPlayersHTML = "";
                let isMyTurn = false;

                data.players.forEach(p => {
                    if (p.username === myUsername) {
                        isMyTurn = p.isTurn;
                    } else {
                        let borderStyle = p.isTurn ? 'border: 3px solid #2ecc71; box-shadow: 0 0 15px #2ecc71;' : 'border: 1px solid #3498db;';
                        otherPlayersHTML += `
                        <div style="background: rgba(0,0,0,0.4); padding: 15px; border-radius: 10px; width: 120px; ${borderStyle}">
                            <h4 style="color: #3498db; margin: 0 0 5px 0;">👤 ${p.username}</h4>
                            <p style="color: #f1c40f; margin: 0; font-size: 24px; font-weight: bold;">${p.cardCount} <span style="font-size: 14px; color: #ccc;">cards</span></p>
                        </div>`;
                    }
                });
                document.getElementById('otherPlayers').innerHTML = otherPlayersHTML;

                // Manage UI based on State
                const turnInd = document.getElementById('turnIndicator');
                const btnCallBluff = document.getElementById('btnCallBluff');
                const playArea = document.getElementById('bluffActions');
                const timerBar = document.getElementById('timerBar');
                const cardPickerArea = document.getElementById('cardPickerArea');
                const cardPickerCards = document.getElementById('cardPickerCards');

                // Reset Picker on every state change
                cardPickerArea.style.display = 'none';

                if (data.stage === 'waiting') {
                    turnInd.innerText = "Waiting to start...";
                    btnCallBluff.style.display = 'none';
                    playArea.style.opacity = '0.5';
                    playArea.style.pointerEvents = 'none';
                }
                else if (data.stage === 'interrogation') {
                    turnInd.innerText = "🚨 INTERROGATION PHASE 🚨";
                    turnInd.style.color = "#e74c3c";
                    playArea.style.opacity = '0.5';
                    playArea.style.pointerEvents = 'none';

                    if (data.latestClaim.indexOf(myUsername) === -1) {
                        btnCallBluff.style.display = 'block';
                    }
                }
                else if (data.stage === 'bluff_called') {
                    btnCallBluff.style.display = 'none';
                    timerBar.style.width = '0%';
                    playArea.style.opacity = '0.5';
                    playArea.style.pointerEvents = 'none';

                    cardPickerArea.style.display = 'block';

                    if (data.accuser === myUsername) {
                        turnInd.innerText = "🔍 PICK A CARD TO REVEAL!";
                        turnInd.style.color = "#f1c40f";
                        document.getElementById('cardPickerText').innerText = "Click one of their cards to flip it:";

                        // Generate the exact number of cards they just played
                        let cardsHtml = "";
                        for (let i = 0; i < data.lastPlayedCount; i++) {
                            cardsHtml += `<div class="card card-back" style="cursor: pointer; border-color: #f1c40f;" onclick="resolveBluff(${i})"></div>`;
                        }
                        cardPickerCards.innerHTML = cardsHtml;
                    } else {
                        turnInd.innerText = `🔍 ${data.accuser} is picking a card...`;
                        turnInd.style.color = "#f1c40f";
                        document.getElementById('cardPickerText').innerText = "Waiting for them to pick...";
                        cardPickerCards.innerHTML = ""; // Hide the clickable cards from non-accusers
                    }
                }
                else if (data.stage === 'playing') {
                    timerBar.style.width = '0%';
                    btnCallBluff.style.display = 'none';

                    if (isMyTurn) {
                        turnInd.innerText = "🟩 YOUR TURN!";
                        turnInd.style.color = "#2ecc71";
                        playArea.style.opacity = '1';
                        playArea.style.pointerEvents = 'auto';
                    } else {
                        turnInd.innerText = "🟥 Waiting for others...";
                        turnInd.style.color = "#e74c3c";
                        playArea.style.opacity = '0.5';
                        playArea.style.pointerEvents = 'none';
                    }
                }
            });

            // The UI Countdown Timer
            socket.on('startInterrogationTimer', (data) => {
                const timerBar = document.getElementById('timerBar');
                timerBar.style.transition = 'none';
                timerBar.style.width = '100%';

                setTimeout(() => {
                    timerBar.style.transition = `width ${data.seconds}s linear`;
                    timerBar.style.width = '0%';
                }, 50);
            });
        });

        // --- Chat Logic ---
        function sendChat() {
            const input = document.getElementById('chatInput');
            const username = document.getElementById('usernameInput').value || "Anon";
            if (input.value.trim() !== "" && currentTable !== "") {
                socket.emit('sendChat', { tableId: currentTable, username, message: input.value });
                input.value = "";
            }
        }
        document.getElementById("chatInput").addEventListener("keypress", e => { if (e.key === "Enter") sendChat(); });
        socket.on('receiveChat', (data) => {
            const hist = document.getElementById('chatHistory');
            let color = data.username === "SYSTEM" ? "#ffcc00" : "#9b59b6";
            hist.innerHTML += `<div><strong style="color: ${color};">${data.username}:</strong> ${data.message}</div>`;
            hist.scrollTop = hist.scrollHeight;
        });
    </script>
</body>

</html>
