<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Hall of Fame</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .board {
            background: var(--glass-bg);
            border: 1px solid var(--neon-gold);
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
            margin: auto;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 20px;
            font-weight: bold;
            color: var(--text-main);
        }

        .row:last-child {
            border-bottom: none;
        }

        .rank-1 { color: #ffd700; font-size: 24px; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .rank-2 { color: #c0c0c0; font-size: 22px; }
        .rank-3 { color: #cd7f32; font-size: 22px; }
    </style>
</head>
<body>

    <h1 class="text-gold">The High Rollers</h1>
    <p class="text-muted" style="margin-bottom: 30px; font-style: italic;">Top 10 richest players in the database</p>

    <div class="board" id="leaderboardData">
        <div style="padding: 20px; color: var(--text-muted);">Loading the vault...</div>
    </div>

    <div style="margin-top: 30px;">
        <a href="/" class="btn-primary" style="text-decoration: none; padding: 10px 20px; display: inline-block;">⬅ Back to the Casino Floor</a>
    </div>

    <script>
        async function loadLeaderboard() {
            try {
                const response = await fetch('/api/leaderboard');
                const players = await response.json();

                const board = document.getElementById('leaderboardData');
                board.innerHTML = ""; 

                if (players.length === 0) {
                    board.innerHTML = "<div style='padding: 20px;'>No players found yet. Go place some bets!</div>";
                    return;
                }

                players.forEach((player, index) => {
                    let rankDisplay = `#${index + 1}`;
                    let rowClass = "row";

                    if (index === 0) { rankDisplay = "🥇"; rowClass += " rank-1"; }
                    if (index === 1) { rankDisplay = "🥈"; rowClass += " rank-2"; }
                    if (index === 2) { rankDisplay = "🥉"; rowClass += " rank-3"; }

                    board.innerHTML += `
                        <div class="${rowClass}">
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <span style="width: 30px; text-align: center;">${rankDisplay}</span>
                                <span>${player.username}</span>
                            </div>
                            <div class="text-green">₹${player.balance.toLocaleString()}</div>
                        </div>
                    `;
                });

            } catch (err) {
                console.error(err);
                document.getElementById('leaderboardData').innerHTML = "<div class='text-red' style='padding: 20px;'>Failed to load database.</div>";
            }
        }
        loadLeaderboard();
    </script>
</body>
</html>
