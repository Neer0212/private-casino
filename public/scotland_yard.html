<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scotland Yard | Elite Gaming</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .map-container {
            width: 100%;
            height: 600px;
            background-color: #1a1a1a;
            border: 2px solid var(--neon-green);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            cursor: grab;
        }
        .map-container:active {
            cursor: grabbing;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }
        
        /* UI Panels superimposed on map */
        .info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--neon-blue);
            padding: 15px;
            border-radius: 8px;
            color: white;
            z-index: 10;
            min-width: 250px;
            pointer-events: none; /* Let clicks pass through if needed, though usually we want to interact with UI */
        }
        
        .action-log {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--neon-purple);
            padding: 10px;
            border-radius: 8px;
            width: 300px;
            height: 150px;
            overflow-y: auto;
            color: #ddd;
            z-index: 10;
            font-size: 14px;
        }

        .inventory-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--neon-gold);
            padding: 15px;
            border-radius: 8px;
            color: white;
            z-index: 10;
            text-align: right;
        }

        .ticket {
            display: inline-block;
            padding: 5px 10px;
            margin: 3px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }
        .ticket.taxi { background: #f1c40f; color: black; }
        .ticket.bus { background: #1abc9c; color: white; }
        .ticket.underground { background: #e74c3c; color: white; }
        .ticket.black { background: #2c3e50; color: white; border: 1px solid #7f8c8d; }

        .join-panel {
            margin-bottom: 20px;
            text-align: center;
        }

        .role-badge {
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }
        .role-mrx { background: black; color: white; border: 1px solid red; }
        .role-detective { background: #2980b9; color: white; }
        
        .mr-x-tracker {
            display: flex;
            gap: 5px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .tracker-slot {
            width: 30px;
            height: 30px;
            border: 1px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            background: #222;
        }
        .tracker-slot.reveal { border-color: red; }

    </style>
</head>
<body>

    <h1 class="text-green" style="text-align: center; margin-top: 20px;">SCOTLAND YARD</h1>

    <div class="nav-links" style="justify-content: center; margin-bottom: 20px;">
        <a href="/" class="nav-leaderboard">🏠 Casino Lobby</a>
    </div>

    <div class="main-layout" style="flex-direction: column; align-items: center; max-width: 1200px; margin: 0 auto;">
        
        <div class="glass-panel join-panel" id="setupPanel">
            <h2>Join the Pursuit</h2>
            <p>Buy-in: ₹5,000</p>
            <input type="text" id="usernameInput" placeholder="Enter Username" style="padding: 10px; font-size: 16px;">
            <input type="text" id="roomInput" placeholder="Room ID (e.g. SY-1)" value="SY-1" style="padding: 10px; font-size: 16px;">
            <button onclick="joinGame()" class="btn-primary" style="padding: 10px 20px; font-size: 16px;">Join Table</button>
            <div id="lobbyStatus" style="margin-top: 15px; color: var(--text-muted);">Waiting to join...</div>
            
            <button id="btnStartGame" onclick="startGame()" class="btn-success" style="display: none; margin-top: 15px;">Start Game</button>
        </div>

        <div id="gameUI" style="display: none; width: 100%;">
            
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; width: 100%;">
                <div class="glass-panel" style="padding: 10px;">
                    <strong>Pot: </strong> <span id="potAmount" class="text-gold">₹0</span>
                </div>
                <div class="glass-panel" style="padding: 10px;">
                    <strong id="turnIndicator" class="text-green">Waiting for game to start...</strong>
                </div>
            </div>

            <div class="map-container" id="mapContainer">
                <canvas id="mapCanvas"></canvas>
                
                <div class="info-panel">
                    <h3 style="margin: 0 0 10px 0;">Players</h3>
                    <div id="playerList"></div>
                    
                    <h4 style="margin: 15px 0 5px 0;">Mr. X Travel Log</h4>
                    <div class="mr-x-tracker" id="mrXTracker">
                        <!-- Slots 1 to 24 -->
                    </div>
                </div>

                <div class="inventory-panel">
                    <h3 style="margin: 0 0 10px 0;">Your Info</h3>
                    <div id="myRole" class="role-badge">Unknown</div>
                    <p style="margin: 10px 0 5px 0;">Current Node: <strong id="currentNode">--</strong></p>
                    <div id="myTickets" style="margin-top: 10px;">
                        <!-- Tickets here -->
                    </div>
                </div>

                <div class="action-log" id="actionLog">
                    <div style="color: #aaa;">Welcome to Scotland Yard.</div>
                </div>
            </div>
            
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/sy_map.js"></script>
</body>
</html>
